name: Run offline semantic experiment
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  semantic:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HF_HUB_DISABLE_XET: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-semantic.txt
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-semantic.txt
      - run: python -m unittest discover -s tests -q
      - run: python -m support_ticket_ai.demo artifacts/demo-v1
      - run: python -m support_ticket_ai.semantic_experiment artifacts/demo-v1/model artifacts/demo-v1/prepared artifacts/semantic-v1.json
      - uses: actions/upload-artifact@v4
        with:
          name: semantic-experiment-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            artifacts/semantic-v1.json
            artifacts/demo-v1/demo_summary.json
            artifacts/demo-v1/prepared/manifest.json
            artifacts/demo-v1/source/LICENSE.txt
            artifacts/demo-v1/source/source_provenance.json
