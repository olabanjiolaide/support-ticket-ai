name: Build semantic browser demo
on:
  workflow_dispatch:
  push:
    paths:
      - support_ticket_ai/semantic_bundle.py
      - support_ticket_ai/multi_intent.py
      - support_ticket_ai/api.py
      - support_ticket_ai/web/**
      - scripts/check_semantic_ui.py
      - .github/workflows/semantic-demo.yml
permissions:
  contents: read
jobs:
  semantic-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HF_HUB_DISABLE_XET: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-semantic.txt
            requirements-checks.txt
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-semantic.txt -r requirements-checks.txt
      - run: python -m unittest discover -s tests -q
      - run: python -m playwright install --with-deps chromium --only-shell
      - run: python -m support_ticket_ai.demo artifacts/demo-v1
      - run: python -m support_ticket_ai.semantic_bundle artifacts/demo-v1/prepared artifacts/semantic-v1
      - run: python -m support_ticket_ai.multi_intent_experiment artifacts/semantic-v1 artifacts/demo-v1/prepared artifacts/multi-intent-pilot.json
      - run: python scripts/check_semantic_ui.py artifacts/demo-v1/model artifacts/semantic-v1 --artifacts artifacts/semantic-ui-checks
      - uses: actions/upload-artifact@v4
        with:
          name: semantic-browser-demo-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            artifacts/demo-v1/model/
            artifacts/demo-v1/demo_summary.json
            artifacts/demo-v1/source/LICENSE.txt
            artifacts/demo-v1/source/source_provenance.json
            artifacts/semantic-v1/
            artifacts/multi-intent-pilot.json
            artifacts/semantic-ui-checks/
