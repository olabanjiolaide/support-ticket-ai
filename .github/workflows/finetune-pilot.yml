name: Run offline encoder fine-tuning pilot
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-semantic.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m support_ticket_ai.demo artifacts/demo-v1
      - run: python -m support_ticket_ai.finetune_experiment artifacts/demo-v1/prepared artifacts/finetune-pilot.json
      - uses: actions/upload-artifact@v4
        with:
          name: offline-finetune-pilot-report
          path: artifacts/finetune-pilot.json
          if-no-files-found: error
          retention-days: 7
