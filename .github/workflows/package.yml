name: Installed package and browser checks
on:
  workflow_dispatch:
  push:
    paths:
      - pyproject.toml
      - requirements*.txt
      - support_ticket_ai/**
      - data/**
      - reports/**
      - scripts/check_installed.py
      - .github/workflows/package.yml
  pull_request:
    paths:
      - pyproject.toml
      - requirements*.txt
      - support_ticket_ai/**
      - data/**
      - reports/**
      - scripts/check_installed.py
      - .github/workflows/package.yml
permissions:
  contents: read
jobs:
  installed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-checks.txt
      - run: python -m pip install -r requirements.txt -r requirements-checks.txt
      - run: python -m unittest discover -s tests -q
      - name: Build wheel and source distribution
        run: python -m build --outdir artifacts/dist
      - name: Install wheel into a separate environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/ticket-wheel-env"
          "$RUNNER_TEMP/ticket-wheel-env/bin/python" -m pip install artifacts/dist/*.whl -r requirements-checks.txt
          "$RUNNER_TEMP/ticket-wheel-env/bin/python" -m playwright install --with-deps chromium --only-shell
      - name: Check the installed app outside the checkout
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/ticket-wheel-env/bin/python" "$GITHUB_WORKSPACE/scripts/check_installed.py" --browser --artifacts "$GITHUB_WORKSPACE/artifacts/package-checks"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-package-${{ github.sha }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            artifacts/dist/
            artifacts/package-checks/
