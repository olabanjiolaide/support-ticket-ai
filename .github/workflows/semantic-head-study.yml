name: Compare semantic class weights and regularization
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_HUB_DISABLE_XET: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-semantic.txt
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-semantic.txt
      - run: python -m unittest discover -s tests -q
      - run: python -m support_ticket_ai.benchmark_prepare artifacts/blendbanking77-v1
      - run: python -m support_ticket_ai.semantic_head_study artifacts/blendbanking77-v1 --output artifacts/semantic-head-study-v1.json
      - uses: actions/upload-artifact@v4
        with:
          name: semantic-head-study-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            artifacts/semantic-head-study-v1.json
            artifacts/blendbanking77-v1/manifest.json
            artifacts/blendbanking77-v1/ATTRIBUTION.txt
            artifacts/blendbanking77-v1/source/*LICENSE*
            data/semantic_head_protocol.json
            support_ticket_ai/encoder_license.txt
